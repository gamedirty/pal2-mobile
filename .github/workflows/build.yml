name: Build APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK components
        uses: android-actions/setup-android@v3

      - name: Install NDK 24 and CMake
        run: |
          yes | sdkmanager --install "ndk;24.0.8215888" "cmake;3.22.1" > /dev/null
          sdkmanager --list_installed | grep -E "ndk|cmake" || true

      - name: Fetch game data and fonts from release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download game-data --repo "$GITHUB_REPOSITORY" \
            --pattern 'pal2-game.tzst.part-*' --pattern 'pal2-game.tzst' --pattern 'pal2-fonts.zip' \
            --dir downloads --clobber
          # reassemble split archive if present (single-file variant also supported)
          if ls downloads/pal2-game.tzst.part-* >/dev/null 2>&1; then
            cat downloads/pal2-game.tzst.part-* > app/src/main/assets/pal2-game.tzst
          else
            cp downloads/pal2-game.tzst app/src/main/assets/pal2-game.tzst
          fi
          unzip -o downloads/pal2-fonts.zip -d app/src/main/assets/
          ls -la app/src/main/assets/pal2-game.tzst app/src/main/assets/pal2-fonts/ | head -10

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/

      - name: Prepare release artifact
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="v$(date +%Y%m%d-%H%M)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "Pal2Mobile-$TAG.apk"
          ls -la Pal2Mobile-*.apk

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Pal2Mobile $TAG" --notes "仙剑奇侠传2 Android 移植版 $TAG" --prerelease
          gh release upload "$TAG" "Pal2Mobile-$TAG.apk" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            app/build/reports/**
            build/reports/**
